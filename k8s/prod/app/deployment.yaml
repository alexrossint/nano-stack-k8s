apiVersion: apps/v1
kind: Deployment
metadata:
  name: nano-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nano-app
  template:
    metadata:
      labels:
        app: nano-app
    spec:
      containers:
        - name: nano-app
          image: nano-stack-app:1.0
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: nano-app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: nano-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          ports:
            - containerPort: 5000
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:16
      env:
        - name: POSTGRES_USER
          value: nanouser
        - name: POSTGRES_DB
          value: nanostack
        - name: POSTGRES_PASSWORD_FILE
          value: /etc/secrets/password
      ports:
        - containerPort: 5432
      resources:
        requests:
          cpu: "10m"
          memory: "25Mi"
        limits:
          cpu: "20m"
          memory: "50Mi"
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: secret-vol
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: postgres-pvc
    - name: secret-vol
      secret:
        secretName: postgres-secret
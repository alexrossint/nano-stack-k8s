apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName}}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Release.Namespace }}.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.appName}}
                port:
                  number: {{ .Values.appPort}}